name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.6"
          python-version: "3.12"
      - run: uv sync --locked --extra cpu
      - run: uv run --locked --extra cpu python -m pytest -q
      - run: uv run --locked --extra cpu modal run modal_app.py::pretrain --help
