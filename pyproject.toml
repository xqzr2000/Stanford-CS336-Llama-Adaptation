[project]
name = "cs336-llama-adaptation"
version = "0.1.0"
description = "Pretrain a 124M Llama-style model on Modal"
requires-python = ">=3.12,<3.13"
dependencies = [
    "modal>=1.3,<2",
    "numpy>=2.2,<3",
    "tokenizers>=0.21,<1",
]

[project.optional-dependencies]
cpu = ["torch==2.8.0"]
cuda = ["torch==2.8.0; sys_platform == 'linux' and platform_machine == 'x86_64'"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = [
    { index = "torch-cpu", extra = "cpu" },
    { index = "torch-cu128", extra = "cuda" },
]

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "torch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
